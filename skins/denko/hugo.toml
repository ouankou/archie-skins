[module]
  [module.hugoVersion]
    min = "0.157.0"
  [[module.imports]]
    path = "github.com/ouankou/archie-skins"
[params]
  mode = "dark"
  customCSS = ["archie-skins/inua/base.css", "archie-skins/denko/tokens.css"]
  [params.inua]
    skin = "denko"
    scheme = "dark"
[markup.highlight]
  lineNumbersInTable = false
  noClasses = false

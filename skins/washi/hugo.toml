[module]
  [module.hugoVersion]
    min = "0.157.0"
  [[module.imports]]
    path = "github.com/ouankou/archie-skins"
[params]
  mode = "light"
  customCSS = ["archie-skins/inua/base.css", "archie-skins/washi/tokens.css"]
  [params.inua]
    skin = "washi"
    scheme = "light"
[markup.highlight]
  lineNumbersInTable = false
  noClasses = false

name: Demo

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE_URL: https://archie.ouankou.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out skins
        uses: actions/checkout@v7

      - name: Check out Archie
        uses: actions/checkout@v7
        with:
          repository: athul/archie
          path: vendor/archie

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: latest
          package-manager-cache: false

      - name: Build and check the demo
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          node tests/smoke.cjs

      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/

      - name: Upload the tested site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

name: Modules
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'
          cache: false
      - name: Install Hugo
        env:
          HUGO_VERSION: '0.157.0'
        run: |
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" -o /tmp/hugo.tar.gz
          echo '78e0a49ec4fb32bfac70a06028297f79b3273fb7e2475eb7ffa1bc208f4c2552  /tmp/hugo.tar.gz' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf /tmp/hugo.tar.gz -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/hugo-bin/hugo" version
      - name: Module integration tests
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser tests
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
          node tests/browser.cjs
      - name: Theme state tests
        run: node --test tests/theme.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: .test-output/screenshots/
          include-hidden-files: true

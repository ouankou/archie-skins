name: Modules
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15.2'
      - name: Install Hugo
        env:
          HUGO_VERSION: '0.169.0'
        run: |
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" -o /tmp/hugo.tar.gz
          echo '2d2f0bfe357d8cb4cec02f6bb28a3bff34978c8dda44b618029c5eb9d66765a7  /tmp/hugo.tar.gz' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf /tmp/hugo.tar.gz -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/hugo-bin/hugo" version
      - name: Module integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Consume published private module ZIPs without replacements
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GOPRIVATE: github.com/ouankou/archie-skins
          SKINS_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Reuse the job's existing repository-scoped read token, no new secret.
          # Go's cache clones do not inherit actions/checkout authentication.
          umask 077
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/skin-git-auth"
          trap 'rm -f "$GIT_CONFIG_GLOBAL"' EXIT
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config --file "$GIT_CONFIG_GLOBAL" http.https://github.com/ouankou/archie-skins.extraheader "AUTHORIZATION: basic $auth"
          python3 tests/check_published_modules.py
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - name: Browser tests
        run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
          node tests/browser.cjs
      - name: Theme state tests
        run: node --test tests/theme.test.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-screenshots
          path: .test-output/screenshots/
          include-hidden-files: true
